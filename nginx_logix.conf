# ==========================================
# RATE LIMITING ZONES
# ==========================================
# Define zonas de memoria para el rate limiting
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Default server: Bloquear accesos por IP o dominios no autorizados
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Certificados self-signed para que Nginx pueda cerrar la conexión SSL correctamente
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Mostrar mensaje con estilo identico al de Nginx (Welcome to nginx!)
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><title>Welcome to nginx!</title><style>body { width: 35em; margin: 0 auto; font-family: Tahoma, Verdana, Arial, sans-serif; }</style></head><body><h1>Welcome to nginx!</h1><p>If you see this page, the nginx web server is successfully installed and working. Further configuration is required.</p><p>For security reasons, this system is restricted to domain access only. Please use the official link to enter:</p><h2><a href="https://logixapp.dev">logixapp.dev</a></h2><p><em>Thank you for using Logix.</em></p></body></html>';
}

server {
    if ($host = www.logixapp.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = logixapp.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name logixapp.dev www.logixapp.dev; 
    
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name logixapp.dev www.logixapp.dev;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/logixapp.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/logixapp.dev/privkey.pem; # managed by Certbot

    # Optimización SSL para HTTP/2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ==========================================
    # 0. SEGURIDAD Y HARDENING
    # ==========================================
    # Cabeceras de seguridad globales
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://logixapp.dev;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate Limiting Global
    limit_req zone=global_limit burst=50 nodelay;

    # Bloquear acceso a archivos sensibles y ocultos
    location ~ /\.(env|git|ht) {
        deny all;
    }

    # Aumentar límite de tamaño de subida (para CSV grandes)
    client_max_body_size 100M;

    # ==========================================
    # 1. FRONTEND (React SPA)
    # ==========================================
    location / {
        root /home/debian/logix/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Kill cache for index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ==========================================
    # 1.1 STATIC ASSETS (Frontend)
    # ==========================================
    location /assets {
        root /home/debian/logix/frontend/dist;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==========================================
    # 2. BACKEND (FastAPI / JSON API)
    # ==========================================
    location /api {
        # Rate Limiting específico para la API
        limit_req zone=api_limit burst=30 nodelay;
        
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Optimización para respuestas JSON grandes (Sincronización)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ==========================================
    # 2.1 STATIC FILES (Backend)
    # ==========================================
    location /static {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 3. OTROS ENDPOINTS (Docs)
    # ==========================================
    location /docs { proxy_pass http://127.0.0.1:8000; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000; }
}
